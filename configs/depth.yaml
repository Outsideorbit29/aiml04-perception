# Depth + distance runtime settings (M4.1, M4.3, M4.5). Read with
# perception.depth.load_depth_config("configs/depth.yaml"); the camera comes from
# configs/camera.yaml (perception.depth.load_camera). Eval jobs use configs/depth_eval.yaml.

estimator:
  model: midas_small        # midas_small (live) | dpt_hybrid (offline comparison only)
  backend: onnx             # onnx (laptop runtime, model exported in M6) | torch (Kaggle,
                            # torch.hub). depth_eval.yaml overrides it to torch; any other Kaggle
                            # job (e.g. the M5 video pipeline) must pass backend="torch" until the
                            # M6 ONNX export exists
  device: null              # torch: null = cuda if available
  half: false               # torch FP16 on CUDA
  onnx_providers: null      # onnx: null = all available (CUDA first when installed)
  every_n_frames: 1         # live path may run MiDaS on every n-th frame (geometric + Kalman
                            # carry the frames in between)

models:
  midas_small:              # MiDaS v2.1 small (EfficientNet-Lite3), ~21M params
    hub_repo: intel-isl/MiDaS
    hub_model: MiDaS_small
    trusted_hub_repos: [rwightman/gen-efficientnet-pytorch]  # loaded inside MiDaS's hubconf
    onnx: models/midas_small.onnx       # exported in M6 (deploy/), gitignored
    input_hw: [256, 448]    # CARLA/BDD 16:9 at the model's native 256 rows
    multiple_of: 32
    mean: [0.485, 0.456, 0.406]         # ImageNet normalisation (MiDaS small transform)
    std: [0.229, 0.224, 0.225]
    resize_interp: cubic
  dpt_hybrid:               # DPT-Hybrid (ViT-B + ResNet-50), ~123M params: offline only
    hub_repo: intel-isl/MiDaS
    hub_model: DPT_Hybrid
    onnx: models/dpt_hybrid.onnx
    input_hw: [384, 672]
    multiple_of: 32
    mean: [0.5, 0.5, 0.5]               # DPT transform
    std: [0.5, 0.5, 0.5]
    resize_interp: cubic

sampling:                   # MiDaS value of a box (perception.depth.sample_box)
  rows_frac: [0.5, 1.0]     # lower half of the box (ARCHITECTURE.md 3.5: avoids background)
  cols_frac: [0.25, 0.75]   # central half of the width
  percentile: 50

geometry:                   # flat-ground distance validity (perception.fusion.DistanceFusion)
  min_angle_deg: 0.5        # ray must point this far below the horizontal (~190 m at 1.65 m)
  bottom_margin_px: 2       # box bottom within this of the image bottom = truncated, no contact
  max_distance_m: 80.0      # beyond this a 1 px row error is > 5 m: geometric is dropped

anchors:                    # objects whose geometric distance aligns MiDaS each frame
  min_score: 0.5
  max_distance_m: 40.0      # near objects only (geometric error grows with Z^2)
  min_box_h_px: 20

alignment:                  # perception.depth.ScaleAligner: 1/Z = s*m + t
  min_points_affine: 3      # fewer anchors -> scale-only fit (t = 0)
  allow_scale_only: true
  huber_k: 1.5              # IRLS Huber threshold in robust-sigma units
  reject_k: 3.0             # final inlier threshold in robust-sigma units
  irls_iters: 5
  sigma_floor: 0.003        # 1/m: floor of the IRLS residual scale; the aligned depth std is
                            # also floored at the camera's geometric inverse-depth std
                            # (CameraModel.inv_depth_std, ~0.0055 1/m for KITTI)
  min_inv_depth: 0.005      # 1/Z below this (Z > 200 m) -> no MiDaS distance
  min_spread_ratio: 1.5     # affine only if farthest / nearest anchor >= this, else scale-only
                            # (anchors at similar depths make the slope arbitrary)
  no_dof_inflation: 2.0     # exactly determined fit (no spare anchor): std = this x the camera's
                            # geometric inverse-depth std (the aligned std never goes below it)

fusion:
  object_classes: [car, truck, bus, person, rider, bicycle, motorcycle]  # road users only
  reuse_alignment_frames: 5 # reuse the last fit this many frames when anchors give none
  correlation: 0.8          # assumed error correlation of geometric and aligned MiDaS, used only
                            # for the fused std (Kalman measurement noise), not the fused
                            # distance. MiDaS is fitted to the anchors' geometric distances, so it
                            # inherits their shared error: the pitch term is ~90 % of the KITTI
                            # and ~65 % of the CARLA geometric inverse-depth variance
                            # (configs/camera.yaml). 0.8 is deliberately conservative; with equal
                            # stds the fused std is sqrt((1 + 0.8) / 2) = 0.95 x either one.
  ego_lane:                 # in_ego_lane = lane check + metric lateral corridor (fusion.py item 6).
                            # |X| = lateral offset of the box bottom-centre at the filtered
                            # distance. Reference geometry: 3.5 m lane, so a lead car inside the
                            # lane has |X| <= (3.5 - 1.8) / 2 = 0.85 m; a car parked at the kerb
                            # (1.8 m wide, inner side >= 2.0 m out, centre ~2.9 m) has a box
                            # centre of ~2.4-2.5 m at 6 m and ~2.2 m when cut by the KITTI image
                            # edge at 4 m (the box spans its near outer to far inner corner),
                            # ~1.6 m when also cut by the image bottom in CARLA at 2.5 m.
    min_lane_confidence: 0.3  # both sides measured AND LaneResult.confidence (mean fraction of
                              # sliding windows hit) >= this -> lanes are trusted
    half_width_lanes_m: 1.5   # with trusted lanes: |X| <= this + Z^2 / (2 curve_radius_m), at
                              # every range (YOLOP's ego area covers kerb-parked cars on unmarked
                              # streets, KITTI 0001: X 2.3-3.6 m at 12-24 m). 1.5 m sits between a
                              # lane-edge lead (0.85 m) and a parked car (>= 2.2 m)
    curve_radius_m: 400.0     # curve allowance: a lane of radius R drifts Z^2 / 2R sideways in
                              # the camera frame. 400 m keeps the KITTI 0001 parked cars out to
                              # ~36 m (allowance 1.6 m there); on R = 100 m a lead centred in its
                              # lane is kept to ~25 m (TTC 2 s there needs 12.5 m/s, about the top
                              # speed on such a curve)
    half_width_no_lanes_m: 1.2  # one-sided / low-confidence / no lanes: corridor only. Worst
                                # parked case: car cut by the image bottom AND side of the 90 deg
                                # CARLA camera at 2.5 m, box centre 1.6 m. 1.2 m tolerates its
                                # distance 25 % short (KITTI case at 4-6 m: 45 %) and a lane-edge
                                # lead's distance 40 % long
    range_no_lanes_m: 30.0    # beyond this, no lead without trusted lanes (straight-road
                              # assumption breaks: 4.5 m drift at 30 m for R = 100 m). AEB at
                              # TTC 2 s needs > 15 m/s closing at 30 m, unlikely on unmarked roads

kalman:                     # perception.fusion.FilterBank (per track id)
  accel_std: 3.0            # m/s^2 white-acceleration process noise
  init_velocity_std: 10.0   # m/s, velocity is unknown on the first measurement
  gate_chi2: 16.0           # innovation NIS above this (4 sigma) = outlier: coast on prediction
  gate_restart_count: 2     # this many gated measurements in a row = id switch -> restart
  reacquire_restart_gap_s: 0.25  # a gated measurement after the id was unmeasured this long
                                 # restarts at once (no coasting on an extrapolated prediction):
                                 # > 2 missed frames at 10 Hz (KITTI), > 4 at 20 Hz (CARLA)
  restart_on_class_change: false  # ByteTrack ignores class; car/truck flips on one object are
                                  # common, and the gate already catches a real id switch
  max_gap_s: 1.0            # no measurement for longer -> restart on the next one
  max_age_s: 2.0            # prune filters older than this
  min_updates_for_ttc: 3    # TTC only after this many measurements ...
  min_track_s_for_ttc: 0.75 # ... spanning at least this long (first to last measurement of the
                            # filter). Simulated parked car at 10-20 m, 20 Hz, inverse-depth noise
                            # 0.004-0.0055 1/m: with 3 updates only, 6-25 % of tracks showed
                            # TTC < 2 s in their first second; 0.5 s still 0.2-1 % at 20 m,
                            # 0.75 s none in 1500 x 10 s tracks
  min_closing_speed_mps: 0.5  # slower closing -> ttc None
  ttc_speed_sigma_k: 2.0    # and closing speed > this x its std sqrt(P[1, 1]) (significant)
