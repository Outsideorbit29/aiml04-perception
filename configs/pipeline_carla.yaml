# Live pipeline inside CARLA (M5.3): perception_node loads this through
# perception.pipeline.load_pipeline_config(). Only the differences to pipeline.yaml are listed.
# Laptop runtime: ONNX Runtime (or TensorRT after M6.4), never PyTorch. Model files come from
# the M6 export (W&B artifacts) and live in the gitignored models/ folder.
base: configs/pipeline.yaml

lanes_config: configs/lanes_carla.yaml   # ROI / warp for the 800x450, 90 deg ego camera
depth_config: configs/depth_carla.yaml   # geometric-first fusion
camera: carla

overrides:
  detector:
    backend: tensorrt                    # M6.4 laptop engine; `onnx` + .onnx works on any GPU
    weights: models/yolo11s-mix.engine   # M5.9 BDD+CARLA fine-tune (W&B yolo11s-mix-onnx:v0), FP16;
                                         # models/yolo11s-bdd.engine is the BDD-only fallback
    device: null
  depth:
    estimator:
      backend: tensorrt                  # models/midas_small.engine (next to the .onnx)
      every_n_frames: 2                  # 10 Hz MiDaS; geometric + Kalman carry the rest
                                         # (ARCHITECTURE.md 6: VRAM / latency budget)

source:
  image_fps: 20.0                        # CARLA fixed_delta_seconds 0.05
  fallback_fps: 20.0
