# CARLA ego camera + fine-tuned YOLO11s: differences to configs/depth.yaml (M5.6 decisions).
# Used by configs/pipeline_carla.yaml (live CARLA loop) and so by configs/carla_eval.yaml.
# Evidence: docs/EXPERIMENTS.md, "Sim eval on the recorded frames (M5.6)".
base: configs/depth.yaml

geometry:
  calibration:              # Detector-box correction (perception.depth.calibration). It belongs
                            # to the DETECTOR: refit when the live weights change.
                            # Live detector yolo11s-mix-best:v0 (M5.9, trained on CARLA frames):
                            # IDENTITY. Its box bottoms already match the GT contact row; on the
                            # 600 CARLA-val frames (W&B 7cnlg0dt) raw geometric AbsRel is 0.081,
                            # bias +0.041, and a refit is ~identity (offset 0.13-0.23 px, box_frac
                            # -0.009..+0.009) gaining <= 0.002 on every hold-out, while the BDD
                            # values below make it worse on every hold-out (odd frames 0.074 ->
                            # 0.090, val blocks 1-3 -> 4-6 0.068 -> 0.078, 4-6 -> 1-3 0.088 ->
                            # 0.106).
                            # If the live detector is yolo11s-bdd-best instead, use
                            # offset_px -0.74, offset_box_frac 0.073 (M5.6 fit, W&B nfekm9vg:
                            # odd-frame hold-out 0.134 -> 0.112; CARLA-val 0.106 -> 0.092, cf6hbj0d)
    offset_px: 0.0
    offset_box_frac: 0.0
    distance_scale: 1.0

fusion:
  mode: geometric_first     # decision 2: in CARLA the flat-ground model is near exact (GT-box
                            # AbsRel 0.040, implied camera height 1.594 m vs 1.6 m) and fusing
                            # MiDaS-small doubles the error (0.087). MiDaS (still every 2nd frame,
                            # pipeline_carla.yaml) only covers boxes without a valid geometric
                            # distance (truncated at the image bottom, near the horizon, > 80 m)
