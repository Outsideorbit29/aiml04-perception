# Single-node Kafka in KRaft mode, same settings as docker-compose.yml. Data is ephemeral (as in
# compose): restarting the pod drops the topics. enableServiceLinks is off because Kubernetes
# would otherwise inject KAFKA_PORT/KAFKA_SERVICE_* env vars that the image turns into broker
# properties.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: aiml01
  labels: {app: kafka}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - {name: plaintext, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            # compose uses 1@kafka:9093; inside the pod the controller is simply localhost.
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_NUM_PARTITIONS, value: "1"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms256m"}
          resources:
            requests: {cpu: 250m, memory: 600Mi}
            limits: {cpu: "1", memory: 900Mi}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: aiml01
spec:
  selector: {app: kafka}
  ports:
    - {name: plaintext, port: 9092, targetPort: 9092}
